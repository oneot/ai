<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Copilot Agent</title>

  <script
    src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js">
  </script>

  <style>
    :root {
      --text-primary: #2d3748;
      --text-secondary: #718096;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      color: var(--text-primary);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient Glassmorphism Background Orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.6;
      pointer-events: none;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: #e0c3fc;
      top: -5%;
      left: 10%;
    }

    .orb-2 {
      width: 450px;
      height: 450px;
      background: #8ec5fc;
      bottom: -10%;
      right: 10%;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: #ffdde1;
      top: 40%;
      left: 30%;
    }

    /* Glassmorphic Container */
    .chat-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1000px;
      height: 90vh;
      height: 90dvh;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Styling */
    .chat-header {
      padding: 20px 28px;
      background: rgba(255, 255, 255, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #48bb78;
      margin-bottom: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #48bb78;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(72, 187, 120, 0.4);
    }

    .chat-header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .chat-header p {
      margin: 0;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    /* Web Chat Wrapper */
    #webchat-container {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    #webchat {
      width: 100%;
      height: 100%;
    }

    /* Custom WebChat Internal UI Adjustments */
    #webchat [role="region"] {
      background: transparent !important;
    }

    #webchat .webchat__basic-transcript {
      background: transparent !important;
    }

    #webchat .webchat__send-box {
      background: rgba(255, 255, 255, 0.4) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.5) !important;
      padding: 12px 16px !important;
      margin: 12px 20px 20px 20px !important;
      border-radius: 24px !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02) !important;
    }

    #webchat .webchat__send-box-main {
      border: none !important;
      background: transparent !important;
    }

    #webchat .webchat__send-box-text-box__input {
      color: var(--text-primary) !important;
      font-family: var(--font-family) !important;
      font-size: 0.95rem !important;
    }

    #webchat .webchat__send-button {
      border-radius: 50% !important;
      transition: all 0.2s ease-in-out !important;
    }

    #webchat .webchat__send-button:hover {
      transform: translateY(-2px);
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Responsive Design for Mobile */
    @media (max-width: 768px) {
      body {
        padding: 0;
      }

      .chat-card {
        max-width: 100%;
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        border: none;
      }

      .chat-header {
        padding: 16px 20px;
      }

      #webchat .webchat__send-box {
        margin: 8px 12px 12px 12px !important;
        padding: 8px 12px !important;
        border-radius: 20px !important;
      }
    }
  </style>
</head>

<body>
  <!-- Ambient Soft Blur Background Objects -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <!-- Glassmorphism Card Container -->
  <div class="chat-card">
    <div class="chat-header">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>online</span>
      </div>
      <h1>Copilot Studio</h1>
      <p>무엇이든 물어보세요. 스마트한 AI 어시스턴트가 도와드립니다.</p>
    </div>

    <div id="webchat-container">
      <div id="webchat" role="main"></div>
    </div>
  </div>

  <script>
    async function getDirectLineToken() {
      const response = await fetch(
        'https://function-joowon-2026-e7aygvdybqd4hbaz.koreacentral-01.azurewebsites.net/api/directlineToken',
        {
          method: 'POST',
          cache: 'no-store'
        }
      );

      if (!response.ok) {
        throw new Error(`토큰 발급 실패: ${response.status}`);
      }

      return response.json();
    }

    async function startChat() {
      const { token } = await getDirectLineToken();

      const directLine = window.WebChat.createDirectLine({
        token
      });

      window.WebChat.renderWebChat(
        {
          directLine,
          locale: 'ko-KR',
          styleOptions: {
            // General Theme Options
            primaryFont: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
            backgroundColor: 'transparent',
            subtle: '#718096',
            
            // Avatars
            botAvatarInitials: 'AI',
            userAvatarInitials: '나',
            botAvatarBackgroundColor: 'rgba(255, 255, 255, 0.8)',
            userAvatarBackgroundColor: '#8ec5fc',

            // Bubbles (Messages)
            bubbleBackground: 'rgba(255, 255, 255, 0.75)',
            bubbleBorderColor: 'rgba(255, 255, 255, 0.9)',
            bubbleBorderRadius: 20,
            bubbleBorderStyle: 'solid',
            bubbleBorderWidth: 1,
            bubbleTextColor: '#2d3748',
            bubbleMinHeight: 40,
            bubbleMaxWidth: 480,

            // User Message Bubble (Gradient & Color)
            bubbleFromUserBackground: 'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
            bubbleFromUserBorderColor: 'rgba(255, 255, 255, 0.6)',
            bubbleFromUserBorderRadius: 20,
            bubbleFromUserBorderStyle: 'solid',
            bubbleFromUserBorderWidth: 1,
            bubbleFromUserTextColor: '#1a365d',

            // Typing Indicator & Animations
            typingAnimationHeight: 20,
            typingAnimationWidth: 36,

            // Input / Send Box Styling
            sendBoxBackground: 'transparent',
            sendBoxButtonColor: '#4a90e2',
            sendBoxButtonColorHover: '#357abd',
            sendBoxTextColor: '#2d3748',
            sendBoxPlaceholderColor: '#a0aec0',

            // Grouping & Spacing
            paddingRegular: 14,
            messageActivityWordBreak: 'break-word',
            timestampColor: '#a0aec0'
          }
        },
        document.getElementById('webchat')
      );
    }

    startChat().catch(error => {
      console.error(error);

      document.getElementById('webchat').textContent =
        '채팅을 시작하지 못했습니다. 잠시 후 다시 시도해 주세요.';
    });
  </script>
</body>
</html>
