<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Copilot Agent</title>

  <script
    src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js">
  </script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #webchat {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="webchat"></div>

  <script>
    async function getDirectLineToken() {
      const response = await fetch(
        'https://function-joowon-2026-e7aygvdybqd4hbaz.koreacentral-01.azurewebsites.net/api/directlineToken',
        {
          method: 'POST',
          cache: 'no-store'
        }
      );

      if (!response.ok) {
        throw new Error(`토큰 발급 실패: ${response.status}`);
      }

      return response.json();
    }

    async function startChat() {
      const { token } = await getDirectLineToken();

      const directLine = window.WebChat.createDirectLine({
        token
      });

      window.WebChat.renderWebChat(
        {
          directLine,
          locale: 'ko-KR',
          styleOptions: {
            accent: '#0078D4',
            botAvatarInitials: 'AI',
            userAvatarInitials: '나'
          }
        },
        document.getElementById('webchat')
      );
    }

    startChat().catch(error => {
      console.error(error);

      document.getElementById('webchat').textContent =
        '채팅을 시작하지 못했습니다. 잠시 후 다시 시도해 주세요.';
    });
  </script>
</body>
</html>
