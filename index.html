아래 코드는 별도의 첫 인사말을 생성하지 않으며, Copilot Studio가 보내는 메시지를 그대로 표시합니다. 타이핑 애니메이션은 Copilot이 `typing` 이벤트를 보낼 때 나타납니다.

```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"

  <title>Copilot Agent</title>

  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>

  <style>
    :root {
      color-scheme: light;
      font-family:
        Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",

    }

    /* 은은한 블러 배경 */

      border-radius: 50%;
      pointer-events: none;
      filter: blur(18px);
    }

    body::before {
      width: min(48vw, 620px);
      aspect-ratio: 1;
      top: -18%;
      left: -12%;
      content: "";
      background:
        radial-gradient(
          circle,
          rgba(162, 219, 255, 0.48) 0%,
          rgba(187, 228, 255, 0.22) 48%,
          transparent 72%
        );
    }

    body::after {
      width: min(46vw, 600px);
      aspect-ratio: 1;
      right: -12%;
      bottom: -22%;
      content: "";
      background:
        radial-gradient(
          circle,
          rgba(205, 185, 255, 0.42) 0%,
          rgba(221, 205, 255, 0.2) 50%,
          transparent 72%
        );
    }

    .background-orb {
      width: min(29vw, 370px);
      aspect-ratio: 1;
      top: 42%;
      left: 45%;
      background:
        radial-gradient(
          circle,
          rgba(186, 226, 255, 0.24) 0%,
          rgba(218, 207, 255, 0.16) 55%,
          transparent 75%
        );
      transform: translate(-50%, -50%);
    }

    .app-shell {
      position: relative;
      z-index: 1;
      display: grid;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      place-items: center;
    }

    .chat-card {
      position: relative;
      width: min(100%, 960px);
      height: min(88vh, 880px);
      height: min(88dvh, 880px);
      min-height: 520px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      background: var(--glass-bg);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(28px) saturate(135%);
      -webkit-backdrop-filter: blur(28px) saturate(135%);
    }

    .chat-card::before {
      position: absolute;
      z-index: 2;
      top: 0;
      right: 12%;
      left: 12%;
      height: 1px;
      content: "";
      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.98),
          transparent
        );
      pointer-events: none;
    }

    #webchat {
      width: 100%;
      height: 100%;
      background: transparent;
    }

    #webchat > * {
      background: transparent !important;
    }

    /* Web Chat 내부 배경 투명화 */
    #webchat .webchat__basic-transcript,
    #webchat .webchat__basic-transcript__scrollable,
    #webchat .webchat__basic-transcript__transcript,
    #webchat .webchat__send-box,
    #webchat .webchat__send-box__main,
    #webchat .webchat__send-box-text-box {
      background: transparent !important;
    }

    /* 스크롤바 */
    #webchat * {
      scrollbar-width: thin;
      scrollbar-color: rgba(124, 141, 179, 0.25) transparent;
    }

    #webchat *::-webkit-scrollbar {
      width: 6px;
    }

    #webchat *::-webkit-scrollbar-track {
      background: transparent;
    }

    #webchat *::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(124, 141, 179, 0.25);
    }

    /* 입력 영역을 유리 카드처럼 표현 */
    #webchat .webchat__send-box {
      margin: 0 20px 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.68) !important;
      box-shadow:
        0 10px 28px rgba(91, 107, 145, 0.09),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #webchat .webchat__send-box-text-box__input {
      color: var(--text-primary) !important;
      font-family: inherit !important;
    }

    #webchat .webchat__send-box-text-box__input::placeholder {
      color: #98a2b6 !important;
    }

    #webchat button {
      transition:
        background-color 160ms ease,
        color 160ms ease,
        transform 160ms ease;
    }

    #webchat button:hover {
      background-color: rgba(115, 140, 232, 0.1) !important;
    }

    #webchat button:active {
      transform: scale(0.96);
    }

    #webchat button:focus-visible,
    #webchat textarea:focus-visible,
    #webchat input:focus-visible {
      outline: 2px solid rgba(115, 140, 232, 0.4) !important;
      outline-offset: -2px;
    }

    /*
      Copilot이 typing activity를 보내면 Web Chat의 기본 점들이 표시됩니다.
      각 점에 시간차를 주어 잔잔한 물결처럼 움직이게 합니다.
    */
    #webchat .webchat__typing-indicator {
      min-width: 62px;
      padding: 12px 16px !important;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 18px !important;
      background: rgba(255, 255, 255, 0.7) !important;
      box-shadow: 0 8px 22px rgba(91, 107, 145, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    #webchat .webchat__typing-indicator circle,
    #webchat .webchat__typing-indicator span {
      animation: typing-wave 1.25s ease-in-out infinite !important;
      transform-origin: center;
    }

    #webchat .webchat__typing-indicator circle:nth-child(2),
    #webchat .webchat__typing-indicator span:nth-child(2) {
      animation-delay: 0.16s !important;
    }

    #webchat .webchat__typing-indicator circle:nth-child(3),
    #webchat .webchat__typing-indicator span:nth-child(3) {
      animation-delay: 0.32s !important;
    }

    @keyframes typing-wave {
      0%,
      60%,
      100% {
        opacity: 0.35;
        transform: translateY(0) scale(0.9);
      }

      30% {
        opacity: 1;
        transform: translateY(-4px) scale(1);
      }
    }

    .status-message {
      position: absolute;
      z-index: 5;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.7;
      text-align: center;
    }

    .status-message.is-visible {
      display: flex;
    }

    @media (max-width: 720px) {
      .app-shell {
        padding: 0;
      }

      .chat-card {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        border-width: 0;
        border-radius: 0;
        box-shadow: none;
      }

      #webchat .webchat__send-box {
        margin:
          0
          max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
        border-radius: 18px;
      }
    }

    @media (max-height: 620px) and (min-width: 721px) {
      .app-shell {
        padding: 12px;
      }

      .chat-card {
        height: calc(100dvh - 24px);
        min-height: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #webchat .webchat__typing-indicator circle,
      #webchat .webchat__typing-indicator span {
        animation-duration: 2s !important;
        transform: none !important;
      }

      #webchat button {
        transition: none;
      }
    }

    @supports not (
      (backdrop-filter: blur(1px)) or
      (-webkit-backdrop-filter: blur(1px))
    ) {
      .chat-card {
        background: rgba(250, 252, 255, 0.96);
      }

      #webchat .webchat__send-box,
      #webchat .webchat__typing-indicator {
        background: rgba(255, 255, 255, 0.94) !important;
      }
    }
  </style>
</head>

<body>
  <div class="background-orb" aria-hidden="true"></div>

  <main class="app-shell">
    <section class="chat-card" aria-label="Copilot 대화">
      <div id="webchat" role="main"></div>
      <div id="status-message" class="status-message" role="status"></div>
    </section>
  </main>

  <script>
    const webChatElement = document.getElementById('webchat');
    const statusMessageElement = document.getElementById('status-message');

    async function getDirectLineToken() {
      const response = await fetch(
        'https://function-joowon-2026-e7aygvdybqd4hbaz.koreacentral-01.azurewebsites.net/api/directlineToken',
        {
          method: 'POST',
          cache: 'no-store'
        }
      );

      if (!response.ok) {
        throw new Error(`토큰 발급 실패: ${response.status}`);
      }

      return response.json();
    }

    function showErrorMessage() {
      statusMessageElement.textContent =
        '채팅을 시작하지 못했습니다. 잠시 후 다시 시도해 주세요.';
      statusMessageElement.classList.add('is-visible');
    }

    async function startChat() {
      const { token } = await getDirectLineToken();

      if (!token) {
        throw new Error('Direct Line 토큰이 없습니다.');
      }

      const directLine = window.WebChat.createDirectLine({ token });

      /*
        별도의 환영 메시지나 conversationUpdate 이벤트를 생성하지 않습니다.
        Copilot Studio에서 실제로 전송된 첫 메시지만 그대로 표시됩니다.
      */
      window.WebChat.renderWebChat(
        {
          directLine,
          locale: 'ko-KR',
          styleOptions: {
            accent: '#738CE8',
            backgroundColor: 'transparent',

            botAvatarInitials: 'AI',
            userAvatarInitials: '나',
            botAvatarBackgroundColor: '#EEF2FF',
            userAvatarBackgroundColor: '#738CE8',

            bubbleBackground: 'rgba(255, 255, 255, 0.72)',
            bubbleBorderColor: 'rgba(255, 255, 255, 0.92)',
            bubbleBorderRadius: 20,
            bubbleBorderStyle: 'solid',
            bubbleBorderWidth: 1,
            bubbleFromUserBackground: 'rgba(222, 230, 255, 0.82)',
            bubbleFromUserBorderColor: 'rgba(255, 255, 255, 0.88)',
            bubbleFromUserBorderRadius: 20,
            bubbleFromUserBorderStyle: 'solid',
            bubbleFromUserBorderWidth: 1,
            bubbleFromUserTextColor: '#263247',
            bubbleTextColor: '#263247',

            rootHeight: '100%',
            rootWidth: '100%',
            paddingRegular: 18,
            transcriptOverlayButtonBackground: 'rgba(255, 255, 255, 0.88)',
            transcriptOverlayButtonBackgroundColorOnFocus:
              'rgba(238, 242, 255, 0.96)',
            transcriptOverlayButtonBackgroundColorOnHover:
              'rgba(238, 242, 255, 0.96)',
            transcriptOverlayButtonColor: '#66769A',

            hideUploadButton: true,
            sendBoxBackground: 'transparent',
            sendBoxBorderTop: 'none',
            sendBoxButtonColor: '#738CE8',
            sendBoxButtonColorOnDisabled: '#B8C0D2',
            sendBoxButtonColorOnFocus: '#5F78D8',
            sendBoxButtonColorOnHover: '#5F78D8',
            sendBoxTextColor: '#263247',
            sendBoxPlaceholderColor: '#98A2B6',
            sendBoxHeight: 58,
            sendBoxMaxHeight: 140,

            showAvatarInGroup: 'status',
            avatarSize: 34,
            avatarBorderRadius: '50%',

            timestampColor: '#929CB0',
            subtle: '#7F8AA2',
            linkColor: '#5F78D8',

            suggestedActionBackgroundColor: 'rgba(255, 255, 255, 0.74)',
            suggestedActionBackgroundColorOnHover:
              'rgba(235, 240, 255, 0.94)',
            suggestedActionBorderColor: 'rgba(115, 140, 232, 0.28)',
            suggestedActionBorderRadius: 16,
            suggestedActionTextColor: '#536BC5',

            typingAnimationBackgroundImage:
              'radial-gradient(circle, #8B9EE4 42%, transparent 44%)',
            typingAnimationDuration: 1250,
            typingAnimationHeight: 18,
            typingAnimationWidth: 54
          }
        },
        webChatElement
      );
    }

    startChat().catch(error => {
      console.error(error);
      showErrorMessage();
    });
  </script>
</body>
</html>
